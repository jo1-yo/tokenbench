# Nebius Token Factory (OpenAI-compatible). Get a key at https://tokenfactory.nebius.com, then:
#   export NEBIUS_API_KEY=...
#   tokenbench models          # check which model ids are currently served
#
# Prices are USD per 1M tokens. Copy them from the Token Factory pricing page before trusting
# any cost numbers — they change. Leave them null and cost columns are simply skipped.
provider:
  base_url: https://api.tokenfactory.nebius.com/v1/
  api_key_env: NEBIUS_API_KEY

models:
  - id: meta-llama/Meta-Llama-3.1-8B-Instruct
    label: llama-3.1-8b
    price_in: null
    price_out: null
  - id: meta-llama/Llama-3.3-70B-Instruct
    label: llama-3.3-70b
    price_in: null
    price_out: null

router:
  small: llama-3.1-8b
  large: llama-3.3-70b
